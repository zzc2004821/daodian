name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i 's/^-Xmx6g/-Xmx3g/' gradle.properties
          echo 'org.gradle.workers.max=2' >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daodian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
